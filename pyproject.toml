[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnintel"
version = "0.1.0"
description = "VulnIntel vulnerability intelligence pipeline (PySpark transforms for Databricks)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pyspark==4.2.*",
    "pytest>=8",
    "ruff==0.17.*",
    "httpx>=0.27",
    "respx>=0.21",
    "pyyaml>=6",
]
jobs = [
    "databricks-sdk>=0.30",
    "databricks-sql-connector>=3",
    "psycopg[binary]>=3.2",
    "google-cloud-bigquery>=3",
    "pyarrow>=15",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["spikes"]
