name: ci

# CI ของ VulnIntel: ตรวจทุก PR ไป main และทุก push เข้า main (cd.yml ฟัง workflow นี้ด้วยชื่อ "ci" ห้ามเปลี่ยนชื่อโดยไม่แก้ cd.yml)
# job test: ruff check + ruff format --check + pytest tests/unit บน PySpark local (ต้องใช้ Java 17) ไม่ต้องใช้ secret
#   pyspark 4.2.0 มีแต่ sdist บน PyPI: install ครั้งแรกต้อง build (~10-15 นาที) จึง cache pip ด้วย key จาก pyproject.toml
# job bundle-validate: databricks bundle validate ทั้ง dev และ prod แล้วตรวจว่า schema ของ dev ชื่อ bronze/gold/ops/silver เป๊ะ
#   (ไม่มี prefix) เพราะ presets.name_prefix: '' ใน dev ยังไม่มีเอกสารยืนยัน มีแค่ความเห็นใน CLI issue ผลลัพธ์เขียนลง Job summary ด้วย
# ชื่อ job "test" และ "bundle-validate" ถูกใช้เป็น required status check ของ branch protection บน main ห้ามเปลี่ยนชื่อ
# secrets (เฉพาะ bundle-validate): DATABRICKS_HOST, DATABRICKS_CLIENT_ID, DATABRICKS_CLIENT_SECRET (OAuth M2M ของ service principal)
#   PR จาก fork ไม่ได้รับ secret job bundle-validate จะล้มซึ่งถูกต้อง (ไม่ปล่อย secret ให้โค้ดภายนอก)
# concurrency: ต่อ ref ยกเลิกรอบเก่าของ PR ที่ยังรันอยู่ได้ (CI ไม่แตะ pipeline ของ Databricks จึงไม่ต้องใช้ group databricks-pipelines)
#   push เข้า main ไม่ยกเลิกกัน เพราะ CI ที่ถูกยกเลิกจะทำให้ cd ข้าม deploy ของ commit นั้น

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    # headroom สำหรับ cold build ของ pyspark (~10-15 นาที)
    timeout-minutes: 30
    # shell: bash = bash -eo pipefail
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Unit tests
        run: pytest tests/unit -v

  bundle-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_AUTH_TYPE: oauth-m2m
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      # client id = application id ของ service principal ใช้เป็น run_as ในทุก target
      BUNDLE_VAR_service_principal_id: ${{ secrets.DATABRICKS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: databricks/setup-cli@v1.22.1

      # เก็บ stdout+stderr ไว้ใน $RUNNER_TEMP แล้วสรุปลง Job summary (log ของ job อ่านจากภายนอกไม่ได้ แต่ summary อ่านได้)
      - name: Validate bundle (dev)
        run: databricks bundle validate -t dev 2>&1 | tee "$RUNNER_TEMP/validate-dev.log"

      - name: Validate bundle (prod)
        run: databricks bundle validate -t prod 2>&1 | tee "$RUNNER_TEMP/validate-prod.log"

      # ตรวจข้อสมมติของ Task 1.2: dev schema ต้องไม่มี prefix (dev_<user>_) ไม่งั้น catalog/ชื่อ schema ที่โค้ดอ้างจะไม่ตรง
      - name: Assert dev schema names are unprefixed
        run: |
          databricks bundle validate -t dev -o json > "$RUNNER_TEMP/dev.json" 2> "$RUNNER_TEMP/dev-json.err"
          actual=$(jq -r '[.resources.schemas[].name] | sort | join(",")' "$RUNNER_TEMP/dev.json")
          expected="bronze,gold,ops,silver"
          {
            echo "### bundle-validate: dev schema names"
            echo
            echo "- expected: \`$expected\`"
            echo "- actual:   \`$actual\`"
            echo
            echo "schemas (resource key -> name):"
            echo '```'
            jq -r '.resources.schemas | to_entries[] | "\(.key) -> \(.value.name)"' "$RUNNER_TEMP/dev.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$actual" != "$expected" ]; then
            echo "::error title=dev schema names are prefixed::expected [$expected] but got [$actual]. presets.name_prefix: '' in databricks.yml (target dev) did not remove the dev_<user>_ prefix from UC schema names."
            exit 1
          fi

      - name: Summarize validate output
        if: always()
        run: |
          {
            for t in dev prod; do
              log="$RUNNER_TEMP/validate-$t.log"
              echo "### bundle validate -t $t"
              if [ -f "$log" ]; then
                echo '```'
                tail -n 60 "$log"
                echo '```'
              else
                echo "(step did not run)"
              fi
            done
            if [ -s "$RUNNER_TEMP/dev-json.err" ]; then
              echo "### validate -t dev -o json (stderr: warnings)"
              echo '```'
              tail -n 40 "$RUNNER_TEMP/dev-json.err"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
